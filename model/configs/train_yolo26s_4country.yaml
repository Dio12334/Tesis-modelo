name: rdd2022_yolo26s_4country_baseline

# Phase-0 canonical baseline for the YOLO-RD thesis track.
# YOLO26-S @640, FULL fine-tune (freeze_layers: 0 — proven best, see run 282d1efd),
# evaluated on the 4-country street-view subset (Japan/India/Czech/United States).
# This is the single reference every YOLO-RD variant (SR-WBCE / CSAF / LGECA) is
# compared against. Same seed(42) + same country_filter MUST be reused at eval to
# avoid the split-leakage trap documented in
# checkpoints/yolo26/282d1efd.../CONTAMINATED.md.

model:
  type: yolo26
  config:
    model_size: "s"
    input_size: 640
    num_classes: 5
    end2end: false
    confidence_threshold: 0.25
    iou_threshold: 0.5
    pretrained_weights: "yolo26s.pt"
    freeze_layers: 0

dataset:
  type: rdd2022
  path: model/data/rdd2022/complete
  class_mapping: model/configs/rdd2022_classes.yaml
  # 4-country street-view subset (matches Lima dashcam deployment target).
  # Excludes Norway (panoramic 3650x2044 — letterbox destroys content),
  # China_Drone (aerial), China_MotorBike (different POV/scale).
  country_filter:
    - Japan
    - India
    - Czech
    - United States

training:
  epochs: 100
  early_stopping_patience: 15
  batch_size: 48
  num_workers: 8
  prefetch_factor: 3
  use_amp: true
  use_channels_last: true
  learning_rate: 0.01
  optimizer: MuSGD
  weight_decay: 0.0005
  momentum: 0.937
  scheduler: cosine
  warmup_epochs: 3
  val_split: 0.2
  checkpoint_dir: ./checkpoints/yolo26
  log_interval: 10
  seed: 42
  # Select the best checkpoint by mAP@0.5 on the val split (evaluated on EMA
  # weights), not by val_loss — val_loss is a weak proxy for mAP. eval_interval
  # bounds the extra per-epoch inference cost; raise it (e.g. 2-3) if per-epoch
  # eval is too slow, at the cost of coarser best-epoch resolution.
  checkpoint_metric: map_50
  # mAP eval runs every 2 epochs (full val inference is costly on ~5k images).
  # In map_50 mode early-stopping patience counts in eval_interval units, so
  # patience 15 here ≈ 30 epochs without mAP improvement. Set to 1 for the most
  # precise best-epoch resolution, or 3 if epochs are too slow.
  eval_interval: 2
  # Baseline keeps the proven enhanced-loss recipe (focal + label smoothing).
  # For the paper-faithful SR-WBCE ablation, branch a variant with focal OFF so
  # SR-WBCE's class re-weighting is isolated (focal also re-weights — overlap
  # would muddy the ablation). See thesis plan.
  loss:
    label_smoothing: 0.01
    focal_loss: true
    focal_gamma: 1.5
    focal_alpha: 0.25
  augmentation:
    # mosaic at full strength (Ultralytics default 1.0) with close-mosaic for
    # the final 10 epochs (mosaic_off_epochs) to fine-tune on clean images.
    mosaic: 1.0
    mixup: 0.05
    mosaic_off_epochs: 10
    horizontal_flip: true
    vertical_flip: false
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.4
    scale: [0.75, 1.25]
    translate: 0.1

evaluation:
  iou_thresholds: [0.5]
  confidence_threshold: 0.25
  confidence_thresholds_sweep:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

output:
  checkpoint_dir: ./checkpoints/yolo26
  results_dir: ./checkpoints/yolo26
  log_dir: ./logs/yolo26
