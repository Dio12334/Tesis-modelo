name: rdd2022_yolo26s_4country_full_lfc

# COMPLETE YOLO-RD on YOLO26-S: CSAF + LGECA + SR-WBCE + LFC (focal OFF).
# Adds LFC (Layer-wise Feature Compression — halves the P5/stride-32 channels)
# to the full model, completing the paper's architecture and cutting params
# (~9.96M -> ~5.5M). Same regime as train_yolo26s_4country_full.yaml otherwise.
# NOTE: LFC narrows the P5 backbone, so those layers start from random init
# (pretrained transfer covers the unchanged layers only) — expect a further
# accuracy drop in this pretrained-transfer regime; LFC's purpose here is the
# parameter/efficiency comparison vs the paper.

model:
  type: yolo26
  config:
    model_size: "s"
    input_size: 640
    num_classes: 5
    end2end: false
    confidence_threshold: 0.25
    iou_threshold: 0.5
    pretrained_weights: "yolo26s.pt"
    freeze_layers: 0
    csaf: true
    lgeca: true
    lfc: true

dataset:
  type: rdd2022
  path: model/data/rdd2022/complete
  class_mapping: model/configs/rdd2022_classes.yaml
  country_filter:
    - Japan
    - India
    - Czech
    - United States

training:
  epochs: 100
  early_stopping_patience: 15
  batch_size: 48
  num_workers: 8
  prefetch_factor: 3
  use_amp: true
  use_channels_last: false
  use_torch_compile: false
  learning_rate: 0.01
  optimizer: SGD
  weight_decay: 0.0005
  momentum: 0.937
  scheduler: cosine
  warmup_epochs: 3
  val_split: 0.2
  checkpoint_dir: ./checkpoints/yolo26
  log_interval: 10
  seed: 42
  checkpoint_metric: map_50
  eval_interval: 2
  loss:
    label_smoothing: 0.0
    focal_loss: false
    sr_wbce: true
    sr_wbce_n: 4
  augmentation:
    mosaic: 1.0
    mixup: 0.05
    mosaic_off_epochs: 10
    horizontal_flip: true
    vertical_flip: false
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.4
    scale: [0.75, 1.25]
    translate: 0.1

evaluation:
  iou_thresholds: [0.5]
  confidence_threshold: 0.25
  confidence_thresholds_sweep:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

output:
  checkpoint_dir: ./checkpoints/yolo26
  results_dir: ./checkpoints/yolo26
  log_dir: ./logs/yolo26
