name: peru_finetune_from_R

# Track A — Fine-tune del mejor modelo RDD (R, mAP 0.642) sobre la data de Perú (relabeleada a
# las 5 clases de RDD con relabel_to_rdd5.py). Mide si agregar Perú mejora el modelo existente.
#
# - `init_checkpoint` carga los pesos de R (solo pesos; optimizer/EMA/epoch frescos) -> fine-tune.
# - LR BAJO (1e-5 head / 1e-6 backbone) y pocas épocas: estamos afinando, no entrenando de cero.
# - El split de val (seed 42, 20%) es el TEST held-out: el fine-tune entrena solo en el 80%, y
#   tanto A0 (zero-shot de R) como A1 (fine-tuned) se evalúan en ese mismo 20% -> comparable.
#
# Clases (= las de R; índices por orden alfabético):
#   0 alligator crack  1 longitudinal crack  2 other corruption  3 pothole  4 transverse crack

model:
  type: rt_detr
  config:
    model_size: "l"
    input_size: 768            # = R
    num_classes: 5             # = R
    confidence_threshold: 0.5
    iou_threshold: 0.5
    backbone_layers: 10
    backbone_lr: 0.000001      # 1e-6 (backbone casi congelado en el fine-tune)
    head_lr: 0.00001           # 1e-5

dataset:
  type: rdd2022
  path: model/data/peru_rdd5/   # Perú relabeleado a 5 clases RDD
  class_mapping: model/configs/rdd2022_classes.yaml

training:
  # Pesos iniciales = mejor modelo RDD (R). Cargar solo pesos (no optimizer/epoch).
  init_checkpoint: ./checkpoints/rt_detr_v2_R/b5da089a-ab0e-4f69-b72c-10f28487e056/best_model.pt

  epochs: 20
  early_stopping_patience: 8
  batch_size: 6
  num_workers: 4
  use_amp: true
  learning_rate: 0.00001       # 1e-5 (base de warmup / eta_min)
  optimizer: AdamW
  weight_decay: 0.0005         # R
  momentum: 0.937
  scheduler: cosine
  warmup_epochs: 1
  val_split: 0.2
  checkpoint_dir: ./checkpoints/rt_detr_peru_finetune
  log_interval: 10
  seed: 42

  use_ema: true
  ema_decay: 0.9999
  ema_tau: 1000                # tau menor: fine-tune corto

  loss:
    focal_loss: true
    focal_gamma: 2.0
    focal_alpha: 0.25          # S1
    no_object_weight: 0.1      # S1
    class_weight: 1.0
    bbox_weight: 5.0
    giou_weight: 2.0

  augmentation:
    horizontal_flip: true
    mosaic: 0.0
    mixup: 0.0
    mosaic_off_epochs: 0
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.4
    scale: [0.8, 1.2]
    translate: 0.1
    random_erasing: 0.3        # R

evaluation:
  iou_thresholds: [0.25, 0.5, 0.75]
  confidence_threshold: 0.5
  confidence_thresholds_sweep:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
     0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]

output:
  checkpoint_dir: ./checkpoints/rt_detr_peru_finetune
  results_dir: ./results/rt_detr_peru_finetune
  log_dir: ./logs/rt_detr_peru_finetune
