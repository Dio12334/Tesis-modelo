name: rdd_local_rt_detr_l

# Entrenamiento sobre el dataset PROPIO (anotaciones de la BD + vistas perspectivas de
# Mapillary), construido con `python -m model.scripts.build_local_dataset`.
# Basado en el mejor config (train_rt_detr_v2_R.yaml = R), con los cambios para esta data:
#   num_classes  5 -> 8           (superset de clases locales)
#   dataset.path -> local_dataset (formato Supervisely generado por build_local_dataset.py)
#   sin country_filter            (un solo origen; el tag de "país" no aplica)
#   checkpoint_dir -> rt_detr_local
# Mantiene S1 (loss pro-recall), S5 (LR discr.), EMA y regularización (R).
#
# Clases (índice = orden alfabético, como las asigna RDD2022Dataset.get_class_names):
#   0 bache  1 fisura_esquina  2 fisura_longitudinal  3 fisura_oblicua
#   4 fisura_transversal  5 piel_de_cocodrilo  6 reparacion  7 tratamiento_superficial
#
# Notas:
#  - Dataset pequeño (~2000 imágenes) y clases raras (fisura_esquina ~22) -> alto riesgo de
#    overfit; la regularización + EMA + early-stopping son clave. Vigila las clases raras.
#  - Las imágenes son 1920x1080; el pipeline las redimensiona a cuadrado (input_size), lo que
#    distorsiona el aspecto 16:9. Es una limitación conocida del pipeline (no crítica, pero a
#    considerar si la precisión sufre).
#  - Para EC2 (más VRAM): subir input_size a 1024 y batch_size a 8.

model:
  type: rt_detr
  config:
    model_size: "l"
    input_size: 768
    num_classes: 8              # << superset local
    confidence_threshold: 0.5
    iou_threshold: 0.5
    backbone_layers: 10
    backbone_lr: 0.00001        # S5
    head_lr: 0.0001             # S5

dataset:
  type: rdd2022                 # mismo loader (formato Supervisely)
  path: model/data/local_dataset/
  class_mapping: model/configs/rdd2022_classes.yaml
  # sin country_filter

training:
  epochs: 40
  early_stopping_patience: 12
  batch_size: 6
  num_workers: 4
  use_amp: true
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.0005          # R
  momentum: 0.937
  scheduler: cosine
  warmup_epochs: 3
  val_split: 0.2
  checkpoint_dir: ./checkpoints/rt_detr_local
  log_interval: 10
  seed: 42

  use_ema: true
  ema_decay: 0.9999
  ema_tau: 2000

  loss:
    focal_loss: true
    focal_gamma: 2.0
    focal_alpha: 0.25           # S1
    no_object_weight: 0.1       # S1
    class_weight: 1.0
    bbox_weight: 5.0
    giou_weight: 2.0

  augmentation:
    horizontal_flip: true
    mosaic: 0.0
    mixup: 0.0
    mosaic_off_epochs: 0
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.4
    scale: [0.8, 1.2]
    translate: 0.1
    random_erasing: 0.3         # R

evaluation:
  iou_thresholds: [0.25, 0.5, 0.75]
  confidence_threshold: 0.5
  confidence_thresholds_sweep:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
     0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]

output:
  checkpoint_dir: ./checkpoints/rt_detr_local
  results_dir: ./results/rt_detr_local
  log_dir: ./logs/rt_detr_local
