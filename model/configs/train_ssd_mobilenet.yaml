name: rdd2022_ssd_mobilenetv3_large

# SSDLite + MobileNetV3-Large baseline (lightweight reference) for the
# RDD2022 benchmark. Mirrors the lightweight backbone slot referenced in
# Hasan & Ahmed, "Improving Road Safety through Deep Learning-based
# Approaches for Road Damage Detection and Classification" (RDD-2020/2022).
#
# Architecture notes:
#  * input_size: 640 to match YOLO26 / RT-DETR for an apples-to-apples
#    comparison. The wrapper rebuilds the SSD anchor generator and
#    SSDLiteHead at 640x640; the MobileNetV3-Large backbone is ImageNet
#    pretrained but the head is trained from scratch.
#  * Background class is added internally (num_classes + 1); the dataset
#    pipeline keeps emitting 0-indexed labels (0..4).
#  * Two-stage training: backbone frozen for 10 epochs, then unfrozen with
#    a discriminative learning rate (backbone_lr << head_lr).
#  * Augmentation: SSD-style (flip + color jitter + scale + translate +
#    RandomIoUCrop). Mosaic / MixUp are explicitly disabled because they
#    destabilise SSD-style hard-negative mining.

model:
  type: ssd_mobilenetv3
  config:
    input_size: 640
    num_classes: 5
    pretrained_backbone: true
    trainable_backbone_layers: 6      # all backbone stages trainable post-unfreeze
    confidence_threshold: 0.25        # threshold applied at .forward() time
    score_threshold: 0.001            # low cut for mAP integration
    nms_threshold: 0.5
    detections_per_image: 300
    topk_candidates: 300
    freeze_backbone_epochs: 0        # stage-1 head-only fine-tune length
    backbone_lr: 0.00003              # stage-2 backbone LR (10x lower than head)
    head_lr: 0.0003                   # stage-2 head LR; also drives optimizer LR

dataset:
  type: rdd2022
  path: model/data/rdd2022/complete
  class_mapping: model/configs/rdd2022_classes.yaml
  country_filter: [Japan, India, Czech, United States]

training:
  epochs: 100
  early_stopping_patience: 15
  batch_size: 24                      # matches YOLO26s effective batch
  num_workers: 8
  prefetch_factor: 3
  use_amp: true
  use_channels_last: false
  learning_rate: 0.0003               # head LR; backbone LR comes from model.config
  optimizer: AdamW
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 5
  val_split: 0.2
  checkpoint_dir: ./checkpoints/ssd_mobilenetv3_large
  log_interval: 25
  seed: 42
  augmentation:
    mosaic: 0.0                       # SSD: disable mosaic / mixup
    mixup: 0.0
    horizontal_flip: true
    vertical_flip: false
    hsv_h: 0.015
    hsv_s: 0.3
    hsv_v: 0.3
    scale: [0.75, 1.25]
    translate: 0.1
    random_iou_crop: true             # SSD-style sample IoU crop (Phase 5)

evaluation:
  iou_thresholds: [0.5]
  confidence_threshold: 0.25
  confidence_thresholds_sweep:
    [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

output:
  checkpoint_dir: ./checkpoints/ssd_mobilenetv3_large
  results_dir: ./checkpoints/ssd_mobilenetv3_large
  log_dir: ./logs/ssd_mobilenetv3_large
