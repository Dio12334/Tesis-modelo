name: rdd2022_binary_classifier

model:
  architecture: efficientnet_b2   # timm model name — B2: 9.2M params, 260px native (vs B0: 5.3M, 224px)
  pretrained: true                 # load ImageNet-pretrained weights
  input_size: 260                  # native resolution for efficientnet_b2
  threshold: 0.15                  # sigmoid threshold — sweet spot from F1 sweep (recall=0.9157, F1=0.9007)

dataset:
  type: rdd2022
  path: model/data/rdd2022/
  class_mapping: model/configs/rdd2022_classes.yaml
  # country_filter: [Japan, India]  # optional: limit to specific countries

training:
  epochs: 50
  early_stopping_patience: 15     # stop if val AUC does not improve
  batch_size: 32
  num_workers: 4
  use_amp: true
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 3
  val_split: 0.2
  checkpoint_dir: ./checkpoints/binary_classifier
  log_interval: 20
  seed: 42
  pos_weight: 2.0                  # bias loss toward recall — fewer missed-damage FNs

  augmentation:
    horizontal_flip: true
    vertical_flip: true            # roads are directional but damage patterns are symmetric
    hsv_h: 0.02
    hsv_s: 0.5
    hsv_v: 0.4
    scale: [0.85, 1.15]            # zoom in/out ±15%
    translate: 0.1                 # shift ±10%

evaluation:
  metric: auc_roc    # primary metric for early stopping and best checkpoint
  threshold: 0.15    # operating point — sweet spot from F1 sweep

output:
  checkpoint_dir: ./checkpoints/binary_classifier
  log_dir: ./logs/binary_classifier
