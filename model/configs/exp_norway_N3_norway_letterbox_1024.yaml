name: exp_N3_norway_letterbox_1024
model:
  type: rt_detr
  config:
    model_size: l
    input_size: 1024
    num_classes: 5
    confidence_threshold: 0.5
    iou_threshold: 0.5
    backbone_layers: 10
    backbone_lr: 1.0e-05
    head_lr: 0.0001
dataset:
  type: rdd2022
  path: model/data/rdd2022/
  class_mapping: model/configs/rdd2022_classes.yaml
  country_filter:
  - Japan
  - India
  - United_States
  - Czech
  - Norway
training:
  letterbox: true
  epochs: 15
  early_stopping_patience: 12
  batch_size: 6
  num_workers: 8
  use_amp: true
  use_torch_compile: false
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.0005
  momentum: 0.937
  scheduler: cosine
  warmup_epochs: 3
  val_split: 0.2
  checkpoint_dir: ./checkpoints/exp_N3_norway_letterbox_1024
  log_interval: 10
  seed: 42
  use_ema: true
  ema_decay: 0.9999
  ema_tau: 2000
  loss:
    focal_loss: true
    focal_gamma: 2.0
    focal_alpha: 0.25
    no_object_weight: 0.1
    class_weight: 1.0
    bbox_weight: 5.0
    giou_weight: 2.0
  augmentation:
    horizontal_flip: true
    mosaic: 0.0
    mixup: 0.0
    mosaic_off_epochs: 0
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.4
    scale:
    - 0.8
    - 1.2
    translate: 0.1
    random_erasing: 0.3
  prefetch_factor: 4
evaluation:
  iou_thresholds:
  - 0.25
  - 0.5
  - 0.75
  confidence_threshold: 0.5
  confidence_thresholds_sweep:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  - 1.0
output:
  checkpoint_dir: ./checkpoints/exp_N3_norway_letterbox_1024
  results_dir: ./results/exp_N3_norway_letterbox_1024
  log_dir: ./logs/rt_detr_norway_768
